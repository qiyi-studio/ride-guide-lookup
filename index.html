<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>遊樂園設施快查</title>
<style>
/* ==========================================================================
   手冊風：左側深色目錄欄 ＋ 右側米色紙面內文 ＋ 襯線體標題 ＋ 金色強調
   （前四支是「多色漸層頁首＋白卡片單欄」，這支刻意做成不一樣的樣子）
   ========================================================================== */
:root{
  --pane:#232019; --pane2:#2E2A22; --pane3:#3A342A;
  --paneInk:#DCD5C5; --paneInk2:#9C9482; --paneLine:#38322A;
  --gold:#B8912A; --gold2:#D9B44A; --goldSoft:#F4E8C6;
  --paper:#FBF6EC; --paper2:#F4EDDE; --paper3:#EFE6D3;
  --ink:#2A2520; --ink2:#544C3E; --ink3:#7C7364;
  --line:#E3D9C5; --line2:#EFE7D8;
  --ex:#1F5C3D; --exBg:#EAF3EC; --exLine:#C9E1D1;
  --note:#9A5B12; --noteBg:#FBF0DC; --noteLine:#EDDBB4;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--paper);color:var(--ink);font:15px/1.75 var(--sans);
  -webkit-text-size-adjust:100%;display:flex;flex-direction:column;overflow:hidden;
}
button{font-family:inherit}

/* ---------- 上方細工具列（沒有漸層頁首） ---------- */
#top{
  flex:0 0 auto;display:flex;align-items:center;gap:12px;
  padding:0 14px;height:52px;background:var(--pane);border-bottom:2px solid var(--gold);
}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap;flex:0 0 auto}
.brand .bk{font-family:var(--serif);font-size:17px;font-weight:700;color:#fff;letter-spacing:1px}
.brand .bs{font-size:11.5px;color:var(--paneInk2);letter-spacing:.5px}
.sBox{position:relative;flex:1 1 auto;max-width:520px;margin:0 auto}
.sBox input{
  width:100%;padding:8px 34px 8px 32px;font-size:14px;font-family:inherit;
  border:1px solid var(--pane3);border-radius:8px;background:#191612;color:#F2ECDF;
}
.sBox input::placeholder{color:#7B7365}
.sBox input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,145,42,.22)}
.sBox .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.65}
.sBox .clr{position:absolute;right:5px;top:50%;transform:translateY(-50%);border:0;background:transparent;
  font-size:17px;color:var(--paneInk2);cursor:pointer;padding:3px 7px;line-height:1}
.tBtns{display:flex;gap:6px;flex:0 0 auto}
.tBtns button{
  background:transparent;border:1px solid var(--pane3);color:var(--paneInk);
  padding:6px 11px;border-radius:7px;font-size:12.5px;cursor:pointer;white-space:nowrap;
}
.tBtns button:hover{border-color:var(--gold);color:var(--gold2)}

/* ---------- 兩欄 ---------- */
#body{flex:1 1 auto;display:flex;min-height:0}

/* 左：目錄 */
#toc{
  flex:0 0 300px;min-width:0;overflow:auto;background:var(--pane);color:var(--paneInk);
  border-right:1px solid var(--paneLine);-webkit-overflow-scrolling:touch;
}
#tree{padding:8px 0 4px}
.tocMsg{padding:16px 16px 4px;font-size:12.5px;color:var(--paneInk2);line-height:1.9}
.tocMsg b{color:var(--gold2)}

.lotHd,.grpHd,.play,.res{
  display:flex;align-items:center;gap:7px;width:100%;text-align:left;
  border:0;background:transparent;color:inherit;cursor:pointer;font-family:inherit;
}
.lotHd{
  padding:9px 12px;font-family:var(--serif);font-size:15px;font-weight:700;color:#F0E9D9;
  letter-spacing:.6px;border-top:1px solid var(--paneLine);
}
.lot:first-child .lotHd{border-top:0}
.lotHd:hover{background:var(--pane2)}
.lotHd .tw{font-size:10px;color:var(--gold);width:10px;flex:0 0 10px}
.lotHd .nm{flex:1 1 auto;min-width:0}
.ct{font-size:11px;color:var(--paneInk2);background:#1A1713;border-radius:999px;padding:1px 8px;flex:0 0 auto}

.grpHd{padding:6px 12px 6px 26px;font-size:13.5px;color:var(--paneInk)}
.grpHd:hover{background:var(--pane2)}
.grpHd .tw{font-size:9px;color:var(--paneInk2);width:9px;flex:0 0 9px}
.grpHd .nm{flex:1 1 auto;min-width:0;word-break:break-word}
.grpHd.on{color:var(--gold2)}
.kk{font-size:10px;font-weight:700;color:#2A2520;background:var(--gold2);border-radius:4px;
  padding:0 5px;letter-spacing:.5px;flex:0 0 auto}

.subHd{padding:7px 12px 3px 40px;font-size:11px;color:var(--paneInk2);letter-spacing:.8px;
  font-weight:700;word-break:break-word}
.play{padding:5px 12px 5px 40px;font-size:13px;color:#C7C0B1;line-height:1.5}
.play:hover{background:var(--pane2);color:#F0E9D9}
.play.on{background:var(--gold);color:#221E17;font-weight:700}
.play .nm{flex:1 1 auto;min-width:0;word-break:break-word}
.play .sb{font-size:11px;color:var(--paneInk2);flex:0 0 auto}
.play.on .sb{color:#4A3F1E}
mark{background:var(--gold2);color:#221E17;border-radius:2px;padding:0 1px}
.play.on mark{background:#221E17;color:var(--gold2)}

.resHd{padding:11px 12px 4px;font-family:var(--serif);font-size:12.5px;font-weight:700;
  color:var(--gold2);letter-spacing:1px;border-top:1px solid var(--paneLine)}
.resHd:first-child{border-top:0}
.res{padding:5px 12px 5px 20px;font-size:13px;color:#C7C0B1;line-height:1.5;flex-wrap:wrap}
.res:hover{background:var(--pane2);color:#F0E9D9}
.res.on{background:var(--gold);color:#221E17;font-weight:700}
.res .nm{flex:1 1 auto;min-width:0;word-break:break-word}
.res .pt{width:100%;font-size:11px;color:var(--paneInk2);padding-left:0}
.res.on .pt{color:#4A3F1E}

#foot{padding:12px 12px 20px;border-top:1px solid var(--paneLine);margin-top:6px;
  font-size:11.5px;color:var(--paneInk2);line-height:1.85}
#foot b{color:var(--paneInk)}
#foot .fb{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
#foot .fb button{background:transparent;border:1px solid var(--pane3);color:var(--paneInk2);
  border-radius:6px;padding:5px 9px;font-size:11.5px;cursor:pointer}
#foot .fb button:hover{border-color:var(--gold);color:var(--gold2)}

/* 右：紙面內文 */
#detail{
  flex:1 1 auto;min-width:0;overflow:auto;background:var(--paper);
  -webkit-overflow-scrolling:touch;
}
.back{display:none}
.doc{max-width:760px;margin:0 auto;padding:26px 30px 70px}
.crumb{font-size:12.5px;color:var(--ink3);letter-spacing:.4px;margin-bottom:10px;word-break:break-word}
.crumb i{font-style:normal;color:var(--gold);margin:0 6px}
.dTop{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.dk{font-size:11.5px;font-weight:700;color:#5A4510;background:var(--goldSoft);
  border:1px solid #E3D09A;border-radius:5px;padding:1px 8px;letter-spacing:.5px}
h1.dt{
  font-family:var(--serif);font-size:27px;font-weight:700;margin:2px 0 0;line-height:1.4;
  letter-spacing:1px;word-break:break-word;
}
.rule{height:3px;background:var(--gold);width:46px;margin:12px 0 20px;border-radius:2px}

.sec{margin-bottom:20px}
.sec h2{
  font-family:var(--serif);font-size:14px;font-weight:700;margin:0 0 7px;color:var(--gold);
  letter-spacing:1.6px;display:flex;align-items:center;gap:9px;
}
.sec h2::after{content:"";flex:1 1 auto;height:1px;background:var(--line)}
.tx{
  background:#fff;border:1px solid var(--line);border-left:3px solid var(--line);
  border-radius:3px;padding:12px 15px;font-size:15px;line-height:1.95;
  white-space:pre-wrap;word-break:break-word;color:var(--ink);
}
.tx.ex{background:var(--exBg);border-color:var(--exLine);border-left-color:var(--ex);
  font-family:var(--sans);font-size:14.5px}
.tx.note{background:var(--noteBg);border-color:var(--noteLine);border-left-color:var(--note);
  font-size:14px;color:#6B4310}
.tx.desc{background:var(--paper2);border-color:var(--line);border-left-color:var(--gold)}
.tx.none{background:transparent;border-style:dashed;border-left-style:dashed;
  color:var(--ink3);font-size:13.5px}

.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px;padding-top:16px;border-top:1px solid var(--line)}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink2);border-radius:7px;
  padding:8px 14px;font-size:13.5px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#221E17;font-weight:700}
.btn.pri:hover{background:var(--gold2);color:#221E17}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* 待命畫面（一打開不列結果，只列園區當入口） */
.idle{max-width:760px;margin:0 auto;padding:34px 30px 70px}
.idle h1{font-family:var(--serif);font-size:24px;font-weight:700;margin:0 0 8px;letter-spacing:1px}
.idle .lead{font-size:14px;color:var(--ink2);line-height:1.95;margin-bottom:6px}
.idle .lead b{color:var(--gold)}
.idle .rule{margin:14px 0 22px}
.ent{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(168px,100%),1fr));gap:10px}
.ent button{
  border:1px solid var(--line);background:#fff;border-radius:8px;padding:12px 13px;
  text-align:left;cursor:pointer;color:var(--ink);line-height:1.5;
}
.ent button:hover{border-color:var(--gold);background:#FFFDF7}
.ent .en{font-family:var(--serif);font-size:16px;font-weight:700;display:block;letter-spacing:.5px}
.ent .ec{font-size:12px;color:var(--ink3);display:block;margin-top:3px}
.tip{margin-top:22px;font-size:12.5px;color:var(--ink3);line-height:1.95;
  border-top:1px solid var(--line);padding-top:14px}
.tip b{color:var(--ink2)}
.tip code{background:var(--paper3);border-radius:4px;padding:1px 5px;font-size:12px}

/* ---------- 彈窗 ---------- */
.mask{position:fixed;inset:0;background:rgba(25,22,18,.6);z-index:90;display:flex;
  align-items:center;justify-content:center;padding:14px}
.modal{background:var(--paper);border-radius:10px;width:100%;max-width:780px;max-height:92vh;
  display:flex;flex-direction:column;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.35);
  border-top:3px solid var(--gold)}
.mHd{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;
  align-items:center;justify-content:space-between;gap:10px;background:#fff}
.mHd h2{margin:0;font-size:16px;font-family:var(--serif);letter-spacing:.8px}
.mBd{padding:14px 16px;overflow:auto}
.mFt{padding:11px 16px;border-top:1px solid var(--line);display:flex;gap:8px;
  justify-content:flex-end;flex-wrap:wrap;background:var(--paper2)}
.x{border:0;background:transparent;font-size:23px;line-height:1;color:var(--ink3);cursor:pointer;padding:2px 6px}
textarea.big2{width:100%;min-height:180px;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace;
  border:1px solid var(--line);border-radius:7px;padding:10px;line-height:1.6;resize:vertical;
  color:var(--ink);background:#fff}
textarea.big2:focus{outline:none;border-color:var(--gold)}
.hint{font-size:12.5px;color:var(--ink3);line-height:1.9}
.hint p{margin:0 0 9px}
.hint b{color:var(--ink2)}
.hint code{background:var(--paper3);border-radius:4px;padding:1px 5px;font-size:12px}
.rowLabel{font-size:11.5px;color:var(--ink3);font-weight:700;letter-spacing:.8px;margin:12px 0 5px}
.prev{background:#fff;border:1px solid var(--line);border-radius:7px;padding:10px 12px;
  font-size:13px;margin-top:10px;line-height:1.85}
.prev.bad{background:#FBE7E3;border-color:#EFC7C0;color:#A63525}
.prev.good{background:var(--exBg);border-color:var(--exLine);color:#14603C}
.radios{display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px;color:var(--ink2);margin:6px 0 2px}
.radios label{display:flex;align-items:center;gap:6px;cursor:pointer}
.radios input{width:16px;height:16px;accent-color:var(--gold)}
select.sel{font-family:inherit;font-size:13.5px;padding:7px 10px;border:1px solid var(--line);
  border-radius:7px;background:#fff;color:var(--ink);max-width:100%}
select.sel:focus{outline:none;border-color:var(--gold)}
table.doc2{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
table.doc2 th,table.doc2 td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
table.doc2 th{background:var(--paper2);color:var(--ink2);white-space:nowrap}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);
  background:#221E17;color:#F2ECDF;padding:11px 20px;border-radius:8px;font-size:14px;z-index:120;
  opacity:0;pointer-events:none;transition:.2s;box-shadow:0 8px 24px rgba(0,0,0,.3);
  max-width:90vw;text-align:center;border:1px solid var(--gold)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- 手機：目錄全寬，點設施後內文整頁滑出 ---------- */
@media(max-width:760px){
  #top{height:auto;flex-wrap:wrap;padding:8px 10px;gap:8px}
  .brand{flex:1 1 auto}
  .tBtns{flex:0 0 auto}
  .sBox{flex:1 1 100%;max-width:none;margin:0;order:3}
  #toc{flex:1 1 100%;border-right:0}
  #detail{
    position:fixed;left:0;right:0;top:0;bottom:0;z-index:60;background:var(--paper);
    transform:translateX(100%);transition:transform .22s ease;
  }
  body.dv #detail{transform:translateX(0)}
  .back{
    display:flex;align-items:center;gap:5px;position:sticky;top:0;z-index:2;width:100%;
    border:0;border-bottom:1px solid var(--line);background:var(--paper2);color:var(--ink2);
    padding:11px 14px;font-size:14px;cursor:pointer;font-family:inherit;
  }
  .doc{padding:16px 16px 60px}
  .idle{padding:20px 16px 60px}
  h1.dt{font-size:23px}
}
/* iOS 點進輸入框會自動放大 → 手機一律 16px */
@media(pointer:coarse){
  input,textarea,select{font-size:16px !important}
}
@media print{
  #top,#toc,.acts,.back{display:none}
  body{display:block;overflow:visible;height:auto}
  #body{display:block}
  #detail{overflow:visible}
}
</style>
</head>
<body>

<div id="top">
  <div class="brand"><span class="bk">📖 遊樂園設施快查</span><span class="bs">遊玩規則與遊玩範例</span></div>
  <div class="sBox">
    <span class="ic">🔍</span>
    <input id="q" type="search" autocomplete="off" placeholder="搜設施名稱，例如：雲霄飛車、旋轉木馬、激流勇進、鬼屋">
    <button class="clr" id="qClr" title="清除" style="display:none">✕</button>
  </div>
  <div class="tBtns">
    <button id="btnAdd">➕ 新增</button>
    <button id="btnExport">⬇ 匯出</button>
    <button id="btnHelp">❓ 說明</button>
  </div>
</div>

<div id="body">
  <nav id="toc"><div id="tree"></div><div id="foot"></div></nav>
  <main id="detail"></main>
</div>

<div id="modal"></div>
<div class="toast" id="toast"></div>

<script>
/* ==========================================================================
   遊樂園設施快查 — 單一檔案版（第二段：資料、搜尋、解析）
   所有資料只留在這台裝置的瀏覽器（localStorage），不會上傳到任何地方。
   ========================================================================== */
"use strict";

/* ---------- 小工具 ---------- */
var $ = function (s) { return document.querySelector(s); };
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function toast(msg) {
  var t = $("#toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { t.classList.remove("on"); }, 2400);
}
function cellClean(s) {
  return String(s == null ? "" : s)
    .replace(/\r\n?/g, "\n").replace(/ /g, " ")
    .replace(/[ \t]+\n/g, "\n").replace(/\n{3,}/g, "\n\n").trim();
}
function flat(s) { return cellClean(s).replace(/\s+/g, " "); }

      var pa = pos[a.n] === undefined ? 999 : pos[a.n], pb = pos[b.n] === undefined ? 999 : pos[b.n];
      return pa - pb;
    });
  }
  return lots;
}
function normalizeData(d) {
  var out = { at: "", lots: [] };
  if (!d || typeof d !== "object") return out;
  out.at = String(d.at || "");
  (Array.isArray(d.lots) ? d.lots : []).forEach(function (l) {
    if (!l || !l.n) return;
    var lot = { n: String(l.n), groups: [] };
    (Array.isArray(l.groups) ? l.groups : []).forEach(function (g) {
      if (!g) return;
      var grp = { n: String(g.n || ""), k: String(g.k || ""), desc: String(g.desc || ""), ex: String(g.ex || ""), note: String(g.note || ""), plays: [] };
      (Array.isArray(g.plays) ? g.plays : []).forEach(function (p) {
        if (!p || !p.n) return;
        grp.plays.push({ n: String(p.n), sub: String(p.sub || ""), rule: String(p.rule || ""), ex: String(p.ex || ""), note: String(p.note || "") });
      });
      if (grp.plays.length || grp.desc) lot.groups.push(grp);
    });
    if (lot.groups.length) out.lots.push(lot);
  });
  return out;
}
function countPlays(d) {
  var n = 0;
  (d && d.lots || []).forEach(function (l) { l.groups.forEach(function (g) { n += g.plays.length; }); });
  return n;
}
/* 把目錄結構攤平成「一筆一個設施」，畫面與匯出都用這份 */
function flatPlays(d) {
  var out = [];
  (d && d.lots || []).forEach(function (l, li) {
    l.groups.forEach(function (g, gi) {
      g.plays.forEach(function (p, pi) {
        out.push({ lot: l.n, k: g.k, cat: g.n, sub: p.sub, name: p.n, rule: p.rule, ex: p.ex, note: p.note,
                   key: playKey(l.n, g.k, g.n, p.sub, p.n), li: li, gi: gi, pi: pi, group: g, play: p });
      });
    });
  });
  return out;
}
function groupKey(lot, g) { return "G" + lot.n + "" + (g.k || "") + "" + (g.n || ""); }

/* ---------- 搜尋 ---------- */
function hayOf(f) {
  if (!f._h) {
    f._nb = bare(f.name);
    f._cb = bare([f.cat, f.sub].join(" "));
    f._h = bare([f.lot, f.cat, f.sub, f.name, f.rule, f.ex, f.note].join(" "));
  }
  return f._h;
}
function scoreOf(f, qb) {
  if (!qb) return 0;
  var h = hayOf(f);
  if (f._nb === qb) return 1000;
  if (f._nb.indexOf(qb) >= 0) return 900 - f._nb.indexOf(qb);
  if (f._cb.indexOf(qb) >= 0) return 700;
  if (bare(f.lot).indexOf(qb) >= 0) return 650;
  var fz = fuzzy(f._nb, qb);
  if (fz > 0) return 400 + Math.min(fz, 500) / 10;
  if (h.indexOf(qb) >= 0) return 300;
  return -1;
}

/* ---------- 複製給遊客的說明文字（只有設施名稱、規則、範例，沒有內部欄位） ---------- */
function memberText(f) {
  var head = [f.lot, f.cat, f.sub].filter(Boolean).join("－");
  var out = ["【" + (head ? head + " " : "") + f.name + "】"];
  if (f.rule) out.push("遊玩規則：", f.rule);
  if (f.ex) out.push("遊玩範例：", f.ex);
  if (f.note) out.push("注意事項：", f.note);
  return out.join("\n");
}

/* ---------- 匯出（Tab 分隔，標題列＝標準格式） ---------- */
var EXP_HEAD = ["園區", "設施類型", "設施分類", "子分類", "設施名稱", "規則說明", "遊玩範例", "備註"];
function tsvCell(v) {
  var s = String(v == null ? "" : v);
  return /[\t\n"]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function exportTsv(d) {
  var rows = [EXP_HEAD.join("\t")], n = 0, nd = 0;
  (d && d.lots || []).forEach(function (l) {
    (l.groups || []).forEach(function (g) {
      /* 分類的總說明（例如 水上樂園的「泳裝規定」）寫成「沒有分類、名稱＝分類名」那一列，
         貼回來時 buildLots 會自動把它變回總說明——跟原表本來的寫法一致。
         不這樣寫，匯出→改→貼回一圈下來總說明就沒了。 */
      if (g.n && (g.desc || g.ex || g.note)) {
        rows.push([l.n, g.k ? "快速通關" : "", "", "", g.n, g.desc, g.ex, g.note].map(tsvCell).join("\t"));
        nd++;
      }
      g.plays.forEach(function (p) {
        rows.push([l.n, g.k ? "快速通關" : "", g.n, p.sub, p.n, p.rule, p.ex, p.note].map(tsvCell).join("\t"));
        n++;
      });
    });
  });
  return { text: rows.join("\n"), n: n, desc: nd };
}


/* ==========================================================================
   狀態與儲存
   ・DATA：目錄結構（園區 → 分類 → 設施），normalizeData 過的
   ・SEL ：目前選到哪一筆 {t:"play"|"group", li, gi, pi}；**不進 localStorage**，
           所以每次打開右邊都是待命畫面（2026-09-10 團隊要求：一打開不列結果）
   ・OPEN：目錄哪幾層是展開的，用名稱當 key（換資料後還對得上）
   ★ 畫面上的 data-* 一律放「索引」而不是 key ——
     t2.js 的 key 用  當分隔字元，塞進 HTML 屬性不保險。
   ========================================================================== */
var K_DATA = "rulesq.data.v1", K_UI = "rulesq.ui.v1";
var DATA = null, Q = "", QB = "", SEL = null, OPEN = {};
var FLAT = null;

function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

function lotKey(lot) { return "L" + lot.n; }
function reindex() { FLAT = flatPlays(DATA); }
function allPlays() { if (!FLAT) reindex(); return FLAT; }

/* 索引 → 那一筆設施（形狀跟 flatPlays 出來的一樣） */
function fAt(li, gi, pi) {
  var l = DATA.lots[li]; if (!l) return null;
  var g = l.groups[gi]; if (!g) return null;
  var p = g.plays[pi]; if (!p) return null;
  return { lot: l.n, k: g.k, cat: g.n, sub: p.sub, name: p.n,
           rule: p.rule, ex: p.ex, note: p.note,
           li: li, gi: gi, pi: pi, group: g, play: p };
}
function gAt(li, gi) {
  var l = DATA.lots[li]; if (!l) return null;
  var g = l.groups[gi]; if (!g) return null;
  return { lot: l, g: g };
}
function selFAt() { return SEL && SEL.t === "play" ? fAt(SEL.li, SEL.gi, SEL.pi) : null; }
function selGAt() { return SEL && SEL.t === "group" ? gAt(SEL.li, SEL.gi) : null; }
function isSelPlay(li, gi, pi) {
  return !!SEL && SEL.t === "play" && SEL.li === li && SEL.gi === gi && SEL.pi === pi;
}
function isSelGroup(li, gi) {
  return !!SEL && SEL.t === "group" && SEL.li === li && SEL.gi === gi;
}

function loadAll() {
  var raw = lsGet(K_DATA), d = null;
  if (raw) { try { d = JSON.parse(raw); } catch (e) { d = null; } }
  var src = "builtin";
  if (d && d.lots && d.lots.length) src = d.src || "paste";
  else d = BUILTIN || {};
  DATA = normalizeData(d);
  DATA.src = src;
  try {
    var u = JSON.parse(lsGet(K_UI) || "{}");
    OPEN = (u && u.open && typeof u.open === "object") ? u.open : {};
  } catch (e) { OPEN = {}; }
  SEL = null;
  reindex();
}
function saveUI() { lsSet(K_UI, JSON.stringify({ open: OPEN })); }
function saveData() {
  if (!lsSet(K_DATA, JSON.stringify({ at: DATA.at, src: DATA.src, lots: DATA.lots })))
    toast("瀏覽器儲存空間不足，這份資料只在這個分頁有效");
}

/* ==========================================================================
   搜尋
   ========================================================================== */
function results() {
  if (!QB) return [];
  var out = [];
  allPlays().forEach(function (f) {
    var s = scoreOf(f, QB);
    if (s >= 0) out.push({ f: f, s: s });
  });
  out.sort(function (a, b) {
    return b.s - a.s || a.f.li - b.f.li || a.f.gi - b.f.gi || a.f.pi - b.f.pi;
  });
  return out;
}

/* ==========================================================================
   左側目錄
   ========================================================================== */
function tocTreeHtml() {
  var h = "";
  DATA.lots.forEach(function (lot, li) {
    var lk = lotKey(lot), on = !!OPEN[lk], n = 0;
    lot.groups.forEach(function (g) { n += g.plays.length; });
    h += '<div class="lot">';
    h += '<button class="lotHd" data-lot="' + li + '"><span class="tw">' + (on ? "▾" : "▸") +
         '</span><span class="nm">' + esc(lot.n) + '</span><span class="ct">' + n + "</span></button>";
    if (on) {
      lot.groups.forEach(function (g, gi) {
        if (!g.n) { h += playsHtml(li, gi, g, true); return; }
        var gon = !!OPEN[groupKey(lot, g)];
        h += '<button class="grpHd' + (isSelGroup(li, gi) ? " on" : "") + '" data-grp="' + li + "." + gi +
             '"><span class="tw">' + (gon ? "▾" : "▸") + '</span><span class="nm">' + esc(g.n) + "</span>" +
             (g.k ? '<span class="kk">' + esc(g.k) + "</span>" : "") +
             '<span class="ct">' + g.plays.length + "</span></button>";
        if (gon) h += playsHtml(li, gi, g, false);
      });
    }
    h += "</div>";
  });
  return h;
}
function playsHtml(li, gi, g, noSub) {
  var h = "", lastSub = null;
  g.plays.forEach(function (p, pi) {
    if (!noSub && p.sub && p.sub !== lastSub) h += '<div class="subHd">' + esc(p.sub) + "</div>";
    if (!noSub) lastSub = p.sub;
    h += '<button class="play' + (isSelPlay(li, gi, pi) ? " on" : "") +
         '" data-play="' + li + "." + gi + "." + pi + '"><span class="nm">' + esc(p.n) + "</span>" +
         (noSub && g.k ? '<span class="kk">' + esc(g.k) + "</span>" : "") + "</button>";
  });
  return h;
}
function tocSearchHtml(list) {
  if (!list.length) {
    return '<div class="tocMsg">找不到「<b>' + esc(Q) + "</b>」。<br>" +
           "換個詞試試，打繁體也找得到簡體資料。<br>規則內文裡的字也搜得到，例如「身高限制」。</div>";
  }
  var h = "", lastLot = null;
  list.forEach(function (x) {
    var f = x.f;
    if (f.lot !== lastLot) { h += '<div class="resHd">' + esc(f.lot) + "</div>"; lastLot = f.lot; }
    var sub = [f.cat, f.sub].filter(Boolean).join(" › ");
    h += '<button class="res' + (isSelPlay(f.li, f.gi, f.pi) ? " on" : "") +
         '" data-play="' + f.li + "." + f.gi + "." + f.pi + '"><span class="nm">' + hilite(f.name, QB) + "</span>" +
         (f.k ? '<span class="kk">' + esc(f.k) + "</span>" : "") +
         (sub ? '<span class="pt">' + hilite(sub, QB) + "</span>" : "") + "</button>";

}
function renderToc() {
  $("#tree").innerHTML = QB ? tocSearchHtml(results()) : tocTreeHtml();
  renderFoot();
}
function renderFoot() {
  /* 團隊 2026-09-11：底下那幾行說明文字拿掉，只留兩顆按鈕 */
  $("#foot").innerHTML =
    '<div class="fb"><button id="btnReset">↩ 回復成內建資料</button>' +
    '<button id="btnWipe">🧹 清除這台裝置存的資料</button></div>';
}

/* ==========================================================================
   右側內文
   ========================================================================== */
function secHtml(title, text, cls, none) {
  if (!text && !none) return "";
  return '<section class="sec"><h2>' + esc(title) + "</h2>" +
         '<div class="tx ' + (text ? cls : "none") + '">' +
         (text ? hilite(text, QB) : esc(none)) + "</div></section>";
}
function detailPlayHtml(f) {

    .map(function (x) { return esc(x); }).join("<i>›</i>");

  h += secHtml("遊玩範例", f.ex || (!f.rule && g ? g.ex : ""), "ex", "原表在這一筆沒有附遊玩範例。");
  h += secHtml("注意事項", f.note || (g ? g.note : ""), "note", "");
  h += '<div class="acts"><button class="btn pri" id="btnCopy">📋 複製說明文字</button>' +
       '<button class="btn" id="btnCopyRule">只複製遊玩規則</button></div>';

}
function detailGroupHtml(li, gi, lot, g) {

  h += '<div class="crumb">' + esc(lot.n) + "</div>";
  if (g.k) h += '<div class="dTop"><span class="dk">' + esc(g.k) + "設施</span></div>";
  h += '<h1 class="dt">' + hilite(g.n, QB) + '</h1><div class="rule"></div>';
  h += secHtml("總說明", g.desc, "desc", "這個分類沒有共用的總說明，直接看底下的設施。");
  h += secHtml("遊玩範例", g.ex, "ex", "");
  h += secHtml("注意事項", g.note, "note", "");
  if (g.plays.length) {
    h += '<section class="sec"><h2>底下的設施</h2><div class="ent">';
    g.plays.forEach(function (p, pi) {

           (p.sub ? '<span class="ec">' + esc(p.sub) + "</span>" : "") + "</button>";
    });
    h += "</div></section>";
  }
  h += '<div class="acts"><button class="btn pri" id="btnCopy">📋 複製說明文字</button></div>';
  return h + "</article>";
}
function idleHtml() {
  var h = '<div class="idle">';
  if (QB) {
    h += "<h1>找到 " + results().length + " 筆</h1>" +
         '<div class="lead">左邊是「<b>' + esc(Q) + "</b>」的搜尋結果，點一筆看遊玩規則與遊玩範例。</div>";
  } else {
    h += "<h1>選一個園區，或直接搜設施名稱</h1>" +

         "急的話直接在上面的搜尋框打設施名稱，<b>打繁體也找得到簡體資料</b>。</div>";
  }
  h += '<div class="rule"></div><div class="ent">';
  DATA.lots.forEach(function (lot, li) {
    var c = 0, gs = 0;
    lot.groups.forEach(function (g) { c += g.plays.length; if (g.n) gs++; });
    h += '<button data-lotgo="' + li + '"><span class="en">' + esc(lot.n) + "</span>" +
         '<span class="ec">' + c + " 種設施" + (gs ? "・" + gs + " 個分類" : "") + "</span></button>";
  });

       '按「📋 複製說明文字」就能整段貼給遊客（只有設施名稱、規則、範例，沒有內部欄位）。<br>' +
       "<b>有新的設施</b>：按右上角「➕ 新增」手動輸入。目前收錄 <code>" +
       countPlays(DATA) + "</code> 筆設施、<code>" + DATA.lots.length + "</code> 個園區。</div>";
  return h + "</div>";
}
function renderDetail() {
  var h = '<button class="back" id="back">‹ 目錄</button>', f = selFAt(), o = selGAt();
  if (f) h += detailPlayHtml(f);
  else if (o) h += detailGroupHtml(SEL.li, SEL.gi, o.lot, o.g);
  else h += idleHtml();

  var d = $("#detail");
  if (d && typeof d.scrollTop === "number") d.scrollTop = 0;
}
function showDetail(on) {

    if (on) document.body.classList.add("dv");
    else document.body.classList.remove("dv");
  } catch (e) {}
}

/* ---------- 選取 ---------- */
function parseIdx(s) {
  return String(s || "").split(".").map(function (x) { return parseInt(x, 10); });
}
function selectPlay(li, gi, pi) {
  var f = fAt(li, gi, pi);
  if (!f) return;
  SEL = { t: "play", li: li, gi: gi, pi: pi };
  OPEN[lotKey(DATA.lots[li])] = true;
  if (f.cat) OPEN[groupKey(DATA.lots[li], f.group)] = true;
  saveUI();
  renderToc(); renderDetail(); showDetail(true);
}
function selectGroup(li, gi) {
  var o = gAt(li, gi);
  if (!o) return;
  SEL = { t: "group", li: li, gi: gi };
  var gk = groupKey(o.lot, o.g);
  OPEN[gk] = !OPEN[gk];
  OPEN[lotKey(o.lot)] = true;
  saveUI();
  renderToc(); renderDetail(); showDetail(true);
}
function toggleLot(li) {
  var lot = DATA.lots[li];
  if (!lot) return;
  var lk = lotKey(lot);
  OPEN[lk] = !OPEN[lk];
  saveUI(); renderToc();
}

/* ==========================================================================
   複製給遊客
   ========================================================================== */
function copyText(txt, okMsg) {
  function fallback() {
    var ta = document.createElement("textarea");
    ta.value = txt;
    ta.style.cssText = "position:fixed;left:-9999px;top:0";
    document.body.appendChild(ta); ta.focus(); ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? okMsg : "這個瀏覽器不給自動複製，請手動選取");
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(function () { toast(okMsg); }, fallback);
  } else fallback();
}
/* 這一筆自己沒寫規則時，用所屬分類的總說明補上，免得複製出去只剩一個標題 */
function copyTarget() {
  var f = selFAt(), o = selGAt();
  if (f) {
    var g = f.group;
    return { lot: f.lot, cat: f.cat, sub: f.sub, name: f.name,
             rule: f.rule || (g ? g.desc : ""),
             ex: f.ex || (!f.rule && g ? g.ex : ""),
             note: f.note || (g ? g.note : "") };
  }
  if (o) {
    return { lot: o.lot.n, cat: "", sub: "", name: o.g.n,
             rule: o.g.desc || "", ex: o.g.ex || "", note: o.g.note || "" };
  }
  return null;
}

    $("#xOut").value = r.text;
    $("#xInfo").textContent = "共 " + r.n + " 筆設施" +
      (v === "*" ? "、" + DATA.lots.length + " 個園區" : "") + "。" +
      (r.desc ? "另有 " + r.desc + " 列是分類的總說明（分類欄留空、名稱欄寫分類名）。" : "");
  }
  $("#xLot").onchange = refresh;
  refresh();
  $("#xCopy").onclick = function () { copyText($("#xOut").value, "已複製，可以貼進試算表了"); };
}

/* ---------- 新增設施（手動輸入）----------
   團隊 2026-09-11：「貼上／更新資料」整個移除，之後有新設施用這個表單手動輸入。
   （t2.js 裡的表格解析函式沒動——建置端 tbuild.js 還借用 parseRuleGrid 讀原始 Excel。） */
function stamp() {
  var p = function (n) { return (n < 10 ? "0" : "") + n; }, d = new Date();
  return d.getFullYear() + "/" + p(d.getMonth() + 1) + "/" + p(d.getDate()) + " " +
         p(d.getHours()) + ":" + p(d.getMinutes());
}
/* 找（或建）園區 → 找（或建）同類型＋同分類的群組 → 放進去。
   同群組已有同名＋同子分類的 → 問過才蓋掉。回傳新設施的位置讓畫面跳過去。 */
function addPlay(p) {
  var lot = null;
  DATA.lots.forEach(function (l) { if (l.n === p.lot) lot = l; });
  if (!lot) { lot = { n: p.lot, groups: [] }; DATA.lots.push(lot); }
  var g = null;
  lot.groups.forEach(function (x) { if (!g && x.n === (p.cat || "") && x.k === (p.k || "")) g = x; });
  if (!g) {
    g = { n: p.cat || "", k: p.k || "", desc: "", ex: "", note: "", plays: [] };
    /* 一般設施的群組插在快速通關前面，跟內建資料的排法一致 */
    var at = lot.groups.length, i;
    if (!g.k) { for (i = 0; i < lot.groups.length; i++) { if (lot.groups[i].k) { at = i; break; } } }
    lot.groups.splice(at, 0, g);
  }
  var dup = null;
  g.plays.forEach(function (o) { if (!dup && o.n === p.name && o.sub === (p.sub || "")) dup = o; });
  if (dup) {
    if (!confirm("已經有「" + p.name + "」這筆設施了，要蓋掉原本的內容嗎？")) return null;
    dup.rule = p.rule || ""; dup.ex = p.ex || ""; dup.note = p.note || "";
  } else {
    g.plays.push({ n: p.name, sub: p.sub || "", rule: p.rule || "", ex: p.ex || "", note: p.note || "" });
  }
  DATA.at = stamp() + " 新增";
  DATA.src = "edited";
  reindex();
  saveData();
  var li = DATA.lots.indexOf(lot), gi = lot.groups.indexOf(g), pi = -1;
  g.plays.forEach(function (o, i2) { if (pi < 0 && o.n === p.name && o.sub === (p.sub || "")) pi = i2; });
  return { li: li, gi: gi, pi: pi };
}
function openAdd() {
  var opts = "";
  DATA.lots.forEach(function (l) { opts += '<option value="' + esc(l.n) + '">' + esc(l.n) + "</option>"; });
  opts += '<option value="__new">＋ 新增一個園區…</option>';
  var body =
    '<div class="hint">填好按「儲存」就會加進左邊的目錄，資料只存在這台裝置的瀏覽器。' +
    "名稱跟現有設施一樣時會先問你要不要蓋掉（＝可以拿來改內容）。</div>" +
    '<div class="rowLabel">園區（必填）</div>' +
    '<select class="sel" id="aLot">' + opts + "</select>" +
    '<input id="aLotNew" class="sel" style="display:none;margin-top:8px" placeholder="新園區的名稱">' +
    '<div class="rowLabel">設施類型</div>' +
    '<select class="sel" id="aKind"><option value="">一般設施</option><option value="快速通關">快速通關</option></select>' +
    '<div class="rowLabel">設施分類（可留空，例如：雲霄飛車、旋轉類）</div>' +
    '<input id="aCat" class="sel" style="width:100%">' +
    '<div class="rowLabel">子分類（可留空，例如：室內雲霄飛車）</div>' +
    '<input id="aSub" class="sel" style="width:100%">' +
    '<div class="rowLabel">設施名稱（必填）</div>' +
    '<input id="aName" class="sel" style="width:100%">' +
    '<div class="rowLabel">遊玩規則（必填）</div>' +
    '<textarea class="big2" id="aRule" style="min-height:110px"></textarea>' +
    '<div class="rowLabel">遊玩範例（可留空）</div>' +
    '<textarea class="big2" id="aEx" style="min-height:70px" placeholder="遊玩範例：…"></textarea>' +
    '<div class="rowLabel">注意事項（可留空）</div>' +
    '<textarea class="big2" id="aNote" style="min-height:54px"></textarea>';
  openModal("➕ 新增設施", body,
    '<button class="btn" id="aCancel">取消</button><button class="btn pri" id="aOk">儲存</button>');
  $("#aLot").onchange = function () { $("#aLotNew").style.display = this.value === "__new" ? "" : "none"; };
  $("#aCancel").onclick = closeModal;
  $("#aOk").onclick = function () {
    var lotName = $("#aLot").value === "__new" ? labelClean($("#aLotNew").value) : $("#aLot").value;
    var name = labelClean($("#aName").value);
    var rule = cellClean($("#aRule").value);
    if (!lotName) { toast("請選（或輸入）園區"); return; }
    if (!name) { toast("請輸入設施名稱"); return; }
    if (!rule) { toast("請輸入遊玩規則"); return; }
    var res = addPlay({ lot: lotName, k: $("#aKind").value, cat: labelClean($("#aCat").value),
                        sub: labelClean($("#aSub").value), name: name, rule: rule,
                        ex: cellClean($("#aEx").value), note: cellClean($("#aNote").value) });
    if (!res) return;
    closeModal();
    Q = ""; QB = "";
    var qi = $("#q"); if (qi) qi.value = "";
    $("#qClr").style.display = "none";
    selectPlay(res.li, res.gi, res.pi);
    toast("已新增「" + name + "」");
  };
}

/* ---------- 使用說明 ---------- */
function openHelp() {
  var body =
    '<div class="hint">' +
    "<p><b>怎麼查</b><br>左邊目錄是<b>園區 → 分類 → 設施</b>三層，一層一層點開；" +
    "急的話直接在上面搜尋框打設施名稱。<b>打繁體找得到簡體資料</b>（打「室內」找得到「室內」），" +
    "規則內文裡的字也搜得到。鍵盤按 <code>/</code> 可以直接跳到搜尋框。</p>" +
    "<p><b>點分類標題會怎樣</b><br>有些分類本身有一段總說明（例如 水上樂園的「泳裝規定」先講一次規則，" +
    "底下再分第1～5名／第6～10名）。點分類標題就會在右邊顯示那段總說明。</p>" +
    "<p><b>複製說明文字</b><br>輸出格式是這樣，可以直接貼給遊客：</p>" +
    '<table class="doc2"><tr><td><b>【園區－分類 設施名稱】</b><br>遊玩規則：…<br>遊玩範例：…<br>注意事項：…</td></tr></table>' +
    "<p>只有設施名稱、規則、範例、注意事項，<b>沒有任何內部欄位</b>。" +
    "如果那一筆自己沒寫規則，會自動補上所屬分類的總說明，不會複製出一個空標題。</p>" +
    "<p><b>「快速通關」標籤</b><br>原表的快速通關本來是另一個分頁，這裡併在同一個園區底下，" +
    "用金色的「快速通關」標籤區分，別跟一般設施搞混。</p>" +
    "<p><b>新增設施</b><br>按右上角「➕ 新增」：選園區（或建新園區）、填設施名稱與遊玩規則，" +
    "分類／子分類／範例／注意可以留空，儲存後馬上出現在目錄裡。" +
    "<b>名稱跟現有設施一樣時會先問你要不要蓋掉</b>，所以要改某一筆的內容，" +
    "就用一樣的園區＋分類＋名稱再存一次即可。</p>" +
    "<p><b>要回到原本的資料</b><br>左邊目錄最下面按「↩ 回復成內建資料」，自己新增的會清掉、回到內建那份。</p>" +
    "<p><b>隱私</b><br>整個工具就是一個 HTML 檔，沒有連任何網路服務、沒有外部套件。" +
    "資料只寫在這台裝置瀏覽器的 localStorage，關掉網頁不會消失，也不會上傳到任何地方。</p>" +
    "</div>";
  openModal("❓ 使用說明", body, '<button class="btn pri" id="hOk">知道了</button>');
  $("#hOk").onclick = closeModal;
}

/* ==========================================================================
   事件
   ========================================================================== */
function bind() {
  var q = $("#q"), tmr = null;
  q.addEventListener("input", function () {
    clearTimeout(tmr);
    tmr = setTimeout(function () {
      Q = q.value; QB = bare(Q);
      $("#qClr").style.display = Q ? "" : "none";
      renderToc(); renderDetail(); showDetail(false);
    }, 130);
  });
  $("#qClr").onclick = function () {
    q.value = ""; Q = ""; QB = ""; this.style.display = "none";
    renderToc(); renderDetail(); showDetail(false); q.focus();
  };

  $("#toc").addEventListener("click", function (e) {
    var b = e.target.closest("[data-play]");
    if (b) { var a = parseIdx(b.getAttribute("data-play")); selectPlay(a[0], a[1], a[2]); return; }
    b = e.target.closest("[data-grp]");
    if (b) { var c = parseIdx(b.getAttribute("data-grp")); selectGroup(c[0], c[1]); return; }
    b = e.target.closest("[data-lot]");
    if (b) { toggleLot(parseIdx(b.getAttribute("data-lot"))[0]); return; }
    if (e.target.id === "btnReset") {
      if (!confirm("要把資料回復成內建的那一份嗎？\n（你貼上的那份會被清掉）")) return;
      lsDel(K_DATA); loadAll();
      renderToc(); renderDetail(); showDetail(false); toast("已回復成內建資料");
      return;
    }
    if (e.target.id === "btnWipe") {
      if (!confirm("要清掉這台裝置存的所有資料與設定嗎？\n（下次打開會回到內建資料）")) return;
      lsDel(K_DATA); lsDel(K_UI);
      OPEN = {}; Q = ""; QB = "";
      $("#q").value = ""; $("#qClr").style.display = "none";
      loadAll();
      renderToc(); renderDetail(); showDetail(false); toast("已清除");
    }
  });

  $("#detail").addEventListener("click", function (e) {
    if (e.target.closest("#back")) { showDetail(false); return; }
    var b = e.target.closest("[data-play]");
    if (b) { var a = parseIdx(b.getAttribute("data-play")); selectPlay(a[0], a[1], a[2]); return; }
    b = e.target.closest("[data-lotgo]");
    if (b) {
      var li = parseIdx(b.getAttribute("data-lotgo"))[0];
      if (DATA.lots[li]) { OPEN[lotKey(DATA.lots[li])] = true; saveUI(); renderToc(); showDetail(false); }
      return;
    }
    if (e.target.closest("#btnCopy")) {
      var t = copyTarget();
      if (t) copyText(memberText(t), "已複製，可以貼給遊客了");
      return;
    }
    if (e.target.closest("#btnCopyRule")) {
      var t2 = copyTarget();
      if (t2 && t2.rule) copyText(t2.rule, "已複製遊玩規則");
      else toast("這一筆沒有規則說明可以複製");
    }
  });

  $("#btnAdd").onclick = openAdd;
  $("#btnExport").onclick = openExport;
  $("#btnHelp").onclick = openHelp;

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { if ($("#mask")) closeModal(); else showDetail(false); }
    if (e.key === "/" && document.activeElement !== q && !$("#mask")) { e.preventDefault(); q.focus(); }
  });
}

/* ---------- 啟動 ---------- */
loadAll();
renderToc();
renderDetail();
bind();

</script>
